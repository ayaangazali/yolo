<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - YOLO</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon"></span>
                    <span class="logo-text">YOLO</span>
                </div>
                <button class="hamburger-btn" id="hamburgerBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="#" class="nav-item active" data-page="home">
                    <span>🏠</span> <span class="nav-text">Home</span>
                </a>
                <a href="#" class="nav-item" data-page="profile">
                    <span>👤</span> <span class="nav-text">Profile</span>
                </a>
                <a href="#" class="nav-item" data-page="settings">
                    <span>⚙️</span> <span class="nav-text">Settings</span>
                </a>
                <a href="#" class="nav-item" data-page="notifications">
                    <span>🔔</span> <span class="nav-text">Notifications</span>
                </a>
                <a href="#" class="nav-item" data-page="help">
                    <span>❓</span> <span class="nav-text">Help & Support</span>
                </a>
                <a href="#" class="nav-item" data-page="activity">
                    <span>📊</span> <span class="nav-text">Activity</span>
                </a>
                <a href="#" class="nav-item" data-page="analytics">
                    <span>📈</span> <span class="nav-text">Analytics</span>
                </a>
                <a href="#" class="nav-item" data-page="team">
                    <span>👥</span> <span class="nav-text">Team</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <div class="user-avatar">T</div>
                    <div class="user-details">
                        <div class="user-name">Test User</div>
                        <div class="user-email">test@yolo.com</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="dashboard-header">
                <div>
                    <h1>Welcome to YOLO</h1>
                    <p>Your AI-powered company builder</p>
                </div>
                <button class="new-project-btn">+ New Project</button>
            </header>

            <!-- Department Categories Section -->
            <section class="categories-section">
                <h2 class="section-title">Your Departments</h2>
                <div class="category-grid" id="categoryGrid">
                    <!-- Cards will be dynamically generated -->
                </div>
                <button class="show-more-btn" id="showMoreBtn">+ Show more</button>
            </section>

            <!-- Glassmorphism Footer Input -->
            <div class="glass-input-container">
                <div class="glass-input-wrapper">
                    <input type="text" 
                           id="userInput" 
                           class="glass-input" 
                           placeholder="Ask a question or share your feedback...">
                    <button class="glass-submit-btn" id="submitInput">
                        <span>→</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
